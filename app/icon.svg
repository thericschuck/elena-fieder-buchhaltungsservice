<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 218">
  <title>Elena Fieder Buchhaltungsservice*</title>
  <!--
    Nachgebaut aus Logo_3 (siehe app/assets/logo/README.md): drei
    freistehende Ordner statt aneinanderliegender wie in der vorherigen
    Fassung. Ein Ordner-Modul (64 breit) wird per <use> dreimal mit 12
    Einheiten Abstand instanziert, statt die Koordinaten dreimal von Hand zu
    verschieben - Aenderungen an der Ordnerform muessen dadurch nur einmal
    gepflegt werden.
  -->
  <mask id="ordner" maskUnits="userSpaceOnUse" x="0" y="0" width="216" height="218">
    <g id="modul" fill="#fff">
      <path d="M12 0h40a12 12 0 0 1 12 12v161H0V12A12 12 0 0 1 12 0Z"/>
      <rect x="0" y="177" width="64" height="19"/>
      <path d="M0 200h64v6a12 12 0 0 1-12 12H12a12 12 0 0 1-12-12v-6Z"/>
    </g>
    <g fill="none" stroke="#000">
      <rect x="20" y="20" width="23" height="86" rx="11.5" stroke-width="5"/>
      <circle cx="31.5" cy="139.5" r="11.75" stroke-width="4.5"/>
    </g>
    <use href="#modul" x="76"/>
    <g fill="none" stroke="#000">
      <rect x="96" y="20" width="23" height="86" rx="11.5" stroke-width="5"/>
      <circle cx="107.5" cy="139.5" r="11.75" stroke-width="4.5"/>
    </g>
    <use href="#modul" x="152"/>
    <g fill="none" stroke="#000">
      <rect x="172" y="20" width="23" height="86" rx="11.5" stroke-width="5"/>
      <circle cx="183.5" cy="139.5" r="11.75" stroke-width="4.5"/>
    </g>
  </mask>
  <rect width="216" height="218" fill="#63B5F5" mask="url(#ordner)"/>
</svg>
